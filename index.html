<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Realtime F0 and pitch piano-roll visualizer for voice and monophonic instruments.">
    <meta name="theme-color" content="#0b0f16">
    <meta name="application-name" content="Frieve F0 Estimator">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Frieve F0">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Frieve F0 Estimator">
    <meta property="og:title" content="Frieve F0 Estimator">
    <meta property="og:description" content="Realtime F0 and pitch piano-roll visualizer for voice and monophonic instruments.">
    <meta property="og:url" content="https://frieve-a.github.io/f0estimator/">
    <meta property="og:image" content="https://frieve-a.github.io/f0estimator/assets/ogp.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Frieve F0 Estimator">
    <meta name="twitter:description" content="Realtime F0 and pitch piano-roll visualizer for voice and monophonic instruments.">
    <meta name="twitter:image" content="https://frieve-a.github.io/f0estimator/assets/ogp.png">
    <title>Frieve F0 Estimator</title>
    <link rel="canonical" href="https://frieve-a.github.io/f0estimator/">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-P7PK35NHTP"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        window.dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-P7PK35NHTP");
    </script>
    <script src="multi-f0-visual.js" defer></script>
    <script src="app.js?v=15" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="brand-copy">
            <h1>Frieve F0 Estimator</h1>
          </div>
        </div>
        <div class="toolbar" aria-label="Controls">
          <div class="mode-selector" role="group" aria-label="Analysis mode">
            <button id="modeToggleBtn" type="button" aria-pressed="true" title="Single F0 history">Graph</button>
            <button id="tunerModeBtn" type="button" aria-pressed="false" title="Single-note tuner">Tuner</button>
            <button id="multiModeBtn" type="button" aria-pressed="false" title="Analyze simultaneous notes with EffeTune">Multi F0</button>
          </div>
          <span id="modeValue" hidden>Graph</span>
          <button id="pauseBtn" class="action-button icon-action" type="button" disabled title="Pause" aria-label="Pause">⏸</button>
          <button id="clearBtn" class="action-button" type="button">Clear</button>
          <button id="uploadBtn" class="action-button icon-action" type="button" title="Upload audio" aria-label="Upload audio">
            <svg class="button-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
              <path d="M10 17V8m0 0 4 4m-4-4-4 4M4 4.5h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </button>
          <input id="uploadInput" class="visually-hidden-file" type="file" accept="audio/*,.wav,.mp3,.m4a,.aac,.ogg,.flac,.webm">
          <button id="exportBtn" class="action-button icon-action" type="button" disabled title="Download CSV" aria-label="Download CSV">
            <svg class="button-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
              <path d="M10 3v9m0 0 4-4m-4 4-4-4M4 15.5h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </button>
          <span class="toolbar-divider" aria-hidden="true"></span>
          <span class="zoom-axis-icon" aria-hidden="true">
            <svg viewBox="0 0 20 20" focusable="false">
              <path d="M3 10h14M7 6 3 10l4 4M13 6l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </span>
          <div class="segmented" aria-label="Time zoom">
            <button id="timeZoomOutBtn" type="button" title="Zoom time out">−</button>
            <button id="timeZoomInBtn" type="button" title="Zoom time in">+</button>
          </div>
          <span class="zoom-axis-icon" aria-hidden="true">
            <svg viewBox="0 0 20 20" focusable="false">
              <path d="M10 3v14M6 7l4-4 4 4M6 13l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
          </span>
          <div class="segmented" aria-label="Pitch zoom">
            <button id="pitchZoomOutBtn" type="button" title="Zoom pitch out">−</button>
            <button id="pitchZoomInBtn" type="button" title="Zoom pitch in">+</button>
          </div>
          <label class="threshold-control">
            <span>Conf</span>
            <output id="thresholdValue">0.50</output>
            <input id="thresholdInput" type="range" min="0.05" max="0.95" step="0.01" value="0.50">
          </label>
        </div>
      </header>

      <main class="workspace">
        <section class="roll-panel" aria-label="Pitch piano roll">
          <div id="canvasWrap" class="canvas-wrap">
            <canvas id="backgroundCanvas"></canvas>
            <canvas id="traceCanvas"></canvas>
            <div id="multiLegend" class="multi-legend" hidden>
              <span class="multi-eyebrow">POLYPHONIC</span>
              <span><i class="confidence-ramp"></i>Confidence</span>
              <span><i class="volume-dots">• ●</i>Volume</span>
            </div>
            <div id="hoverHint" class="hover-hint" hidden></div>
            <div id="uploadOverlay" class="upload-overlay" hidden aria-live="polite">
              <div class="upload-progress-panel" role="status" aria-label="Upload processing">
                <div id="uploadProgressLabel" class="upload-progress-label">Processing audio</div>
                <div class="upload-progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                  <div id="uploadProgressBar" class="upload-progress-bar"></div>
                </div>
                <div id="uploadProgressPercent" class="upload-progress-percent">0%</div>
                <button id="cancelUploadBtn" class="action-button upload-cancel-button" type="button">Cancel</button>
              </div>
            </div>
            <div
              id="pitchScrollbar"
              class="pitch-scrollbar"
              role="scrollbar"
              aria-label="Pitch range"
              aria-orientation="vertical"
              aria-valuemin="24"
              aria-valuemax="108"
              aria-valuenow="62"
            >
              <div id="pitchScrollbarThumb" class="pitch-scrollbar-thumb"></div>
            </div>
            <div id="startOverlay" class="start-overlay">
              <div class="start-stack">
                <div class="start-visual" aria-hidden="true">
                  <span></span>
                  <span></span>
                  <span></span>
                  <span></span>
                  <span></span>
                </div>
                <button id="overlayStartBtn" class="primary large" type="button">Start Mic</button>
                <p>Ready for the next take.</p>
              </div>
            </div>
          </div>
        </section>
      </main>

      <footer class="statusbar">
        <div id="currentStatus" class="status-primary current-status" aria-label="Current:">
          <span class="current-status-label">Current:</span>
          <span id="currentCents" class="current-status-cell current-status-number"></span>
          <span id="currentHz" class="current-status-cell current-status-number"></span>
          <span id="currentMidi" class="current-status-cell current-status-number"></span>
          <span id="currentConf" class="current-status-cell current-status-number"></span>
        </div>
        <div id="rangeStatus">Range: --</div>
        <div id="windowStatus">Window: --</div>
        <div id="engineBadge" class="engine-badge">CREPE</div>
        <a class="status-link" href="https://github.com/Frieve-A/f0estimator" target="_blank" rel="noopener noreferrer">GitHub</a>
        <div id="messageStatus" class="status-message">Idle</div>
      </footer>
    </div>
  </body>
</html>
